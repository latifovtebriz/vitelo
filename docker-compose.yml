services:
  # ── FastAPI Backend ──
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vitelo-api
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Celery Worker ──
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: vitelo-worker
    env_file:
      - backend/.env
    depends_on:
      - backend
    restart: unless-stopped
