upstream vitelo_api {
    server backend:8000;
}

server {
    listen 80;
    server_name api.vitelo.me;

    # Redirect HTTP → HTTPS (handled by Cloudflare in production)
    # Uncomment below if using Certbot directly:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://vitelo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long AI generation requests
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Block direct IP access
    location = /robots.txt {
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Health check (no proxy headers needed)
    location = /health {
        proxy_pass http://vitelo_api/health;
    }
}
